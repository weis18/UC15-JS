<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Viagem</title>
</head>
<body>

    <h1 id="titulo">Painel de Viagem</h1>

    <h2>Escolha uma cidade</h2>

    <input id="cidade" type="text" placeholder="Digite uma cidade">

    <button id="botaoCidade">Mostrar mensagem</button>

    <p id="mensagem"></p>

    <button id="botaoEstilo">Destacar mensagem</button>

    <h2>Contador</h2>

    <button id="menos">-</button>

    <span id="contador">10</span>

    <button id="mais">+</button>

    
    <script src="script.js"></script>
</body>
</html>
